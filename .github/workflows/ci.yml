name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Valeurs fictives propres à la CI (aucun secret réel).
  NODE_ENV: test
  JWT_SECRET: ci-only-not-a-secret-0123456789abcdef
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tender_watch?schema=public
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tender_watch_test?schema=public
  EMAIL_PROVIDER: log
  AI_PROVIDER: mock
  PIPELINE_CRON_ENABLED: "false"
  TENDER_TIMEZONE: Africa/Ouagadougou

jobs:
  checks:
    name: Lint, types, tests et builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tender_watch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.8
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/collector/pyproject.toml

      - name: Outils système (pdftotext, client PostgreSQL)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils postgresql-client

      - name: Fichier .env de CI
        run: cp .env.example .env

      - name: Dépendances
        run: |
          pnpm install --frozen-lockfile
          python -m venv services/collector/.venv
          services/collector/.venv/bin/pip install -q -e 'services/collector[dev]'

      - name: Base de test
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres tender_watch_test
          pnpm --filter api exec prisma generate
          DATABASE_URL="$TEST_DATABASE_URL" pnpm --filter api exec prisma migrate deploy

      - name: Lint et types
        run: pnpm lint

      - name: Tests unitaires (API, web, collecteur)
        run: pnpm test

      - name: Tests e2e API
        run: pnpm test:e2e:api

      - name: Builds
        run: pnpm build

      - name: Navigateur Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Tests e2e Playwright (stack complète)
        run: pnpm test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            test-results
          retention-days: 7
